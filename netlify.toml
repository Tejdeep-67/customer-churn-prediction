# Netlify settings. The web demo in docs/ is static: the model runs in the browser from
# docs/model.json (written by src/train.py), so there is no build step and no server.
# The Flask API in app.py is only for running locally.
[build]
  publish = "docs"

[[headers]]
  for = "/model.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
