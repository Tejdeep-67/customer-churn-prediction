<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Churn Predictor (local)</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 30px auto; padding: 0 16px; }
    label { display: block; margin-top: 10px; font-size: 14px; }
    input, select { width: 100%; padding: 6px; margin-top: 3px; }
    button { margin-top: 16px; padding: 10px 18px; }
    pre { background: #f4f4f4; padding: 12px; }
  </style>
</head>
<body>
  <h2>Churn Predictor (Flask API)</h2>
  <p>Fill a few fields, the rest use common values. The nicer version is the web demo in docs/ (live on Netlify).</p>

  <label>Tenure (months) <input id="tenure" type="number" value="3" min="0"></label>
  <label>Monthly charges <input id="MonthlyCharges" type="number" value="85" min="0"></label>
  <label>Contract
    <select id="Contract"><option>Month-to-month</option><option>One year</option><option>Two year</option></select>
  </label>
  <label>Internet service
    <select id="InternetService"><option>Fiber optic</option><option>DSL</option><option>No</option></select>
  </label>
  <label>Payment method
    <select id="PaymentMethod">
      <option>Electronic check</option><option>Mailed check</option>
      <option>Bank transfer (automatic)</option><option>Credit card (automatic)</option>
    </select>
  </label>
  <button onclick="send()">Predict</button>
  <pre id="out"></pre>

  <script>
    async function send() {
      const v = id => document.getElementById(id).value;
      const internet = v("InternetService");
      const addon = internet === "No" ? "No internet service" : "No";
      const body = {
        tenure: v("tenure"), MonthlyCharges: v("MonthlyCharges"),
        TotalCharges: Number(v("tenure")) * Number(v("MonthlyCharges")),
        gender: "Male", SeniorCitizen: 0, Partner: "No", Dependents: "No",
        PhoneService: "Yes", MultipleLines: "No", InternetService: internet,
        OnlineSecurity: addon, OnlineBackup: addon, DeviceProtection: addon, TechSupport: addon,
        StreamingTV: addon, StreamingMovies: addon, Contract: v("Contract"),
        PaperlessBilling: "Yes", PaymentMethod: v("PaymentMethod"),
      };
      const res = await fetch("/predict", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
    }
  </script>
</body>
</html>
